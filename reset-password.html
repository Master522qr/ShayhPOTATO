<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Восстановление пароля аккаунта LunaVisual через Supabase.">
  <link rel="canonical" href="https://lunavisual.ru/reset-password.html">
<title>LunaVisual | Восстановление пароля</title>
  
  <link rel="icon" type="image/png" href="lunavisual-logo.png">
  <link rel="shortcut icon" type="image/png" href="lunavisual-logo.png">
  <link rel="apple-touch-icon" href="lunavisual-logo.png">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@700;800;900&display=swap" rel="stylesheet">

  <!-- Supabase JS -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --p-primary: #9d4edd;
      --p-primary-hover: #b366ff;
      --p-glow: rgba(157, 78, 221, 0.45);
      --p-deep: #5a189a;
      --p-electric: #7b2cbf;
      --p-light: #c77dff;
      --p-soft: #e0aaff;
      --p-muted: #9f8bc2;

      --bg-dark: #07060b;
      --bg-surface: #0e0a16;
      --bg-card: rgba(20, 14, 32, 0.7);
      --bg-card-hover: rgba(32, 22, 52, 0.85);

      --border-subtle: rgba(157, 78, 221, 0.22);
      --border-active: rgba(199, 125, 255, 0.5);

      --text-main: #f8f6fc;
      --text-muted: #a39bb5;
      --text-dim: #706884;

      --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      --font-heading: 'Plus Jakarta Sans', 'Inter', sans-serif;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-user-select: none !important;
      -moz-user-select: none !important;
      -ms-user-select: none !important;
      user-select: none !important;
      -webkit-touch-callout: none !important;
    }

    input, textarea, [contenteditable="true"] {
      -webkit-user-select: text !important;
      -moz-user-select: text !important;
      -ms-user-select: text !important;
      user-select: text !important;
    }

    img {
      -webkit-user-drag: none !important;
      user-drag: none !important;
    }

    html {
      scroll-behavior: smooth;
      color-scheme: dark;
    }

    * {
      scrollbar-width: thin;
      scrollbar-color: var(--p-primary, #9d4edd) var(--bg-dark, #07090e);
    }
    ::-webkit-scrollbar {
      width: 11px;
      height: 11px;
    }
    ::-webkit-scrollbar-track {
      background: linear-gradient(180deg, var(--bg-surface, #0f081a) 0%, var(--bg-dark, #07090e) 100%);
      border-left: 1px solid var(--border-subtle);
    }
    ::-webkit-scrollbar-thumb {
      background: linear-gradient(180deg, var(--p-light) 0%, var(--p-primary) 35%, var(--p-electric) 70%, var(--p-deep) 100%);
      border-radius: 999px;
      border: 2px solid var(--bg-dark, #07090e);
      box-shadow: 0 0 16px var(--p-glow), inset 0 1px 2px rgba(255, 255, 255, 0.6);
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: var(--font-sans);
      min-height: 100vh;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    /* Ambient Background Glows */
    .ambient-glow-1, .ambient-glow-2 {
      position: fixed;
      border-radius: 50%;
      pointer-events: none;
      z-index: 0;
    }
    .ambient-glow-1 {
      top: -16%;
      left: 50%;
      transform: translateX(-50%);
      width: 1000px;
      height: 750px;
      background: radial-gradient(ellipse at center, var(--theme-glow-1, #9d4edd) 0%, var(--p-electric) 35%, transparent 70%);
      filter: blur(115px);
      opacity: 0.55;
      animation: floatGlow 20s ease-in-out infinite alternate;
    }
    .ambient-glow-2 {
      top: 30%;
      right: -10%;
      width: 850px;
      height: 850px;
      background: radial-gradient(circle, var(--theme-glow-2, #7b2cbf) 0%, var(--p-deep) 40%, transparent 70%);
      filter: blur(125px);
      opacity: 0.45;
      animation: floatGlow 24s ease-in-out infinite alternate -6s;
    }

    .cyber-grid-bg {
      position: fixed;
      inset: 0;
      background-image: 
        linear-gradient(to right, var(--border-subtle) 1px, transparent 1px),
        linear-gradient(to bottom, var(--border-subtle) 1px, transparent 1px);
      background-size: 55px 55px;
      mask-image: radial-gradient(circle at 50% 50%, rgba(0,0,0,0.95) 0%, rgba(0,0,0,0.55) 75%, transparent 100%);
      -webkit-mask-image: radial-gradient(circle at 50% 50%, rgba(0,0,0,0.95) 0%, rgba(0,0,0,0.55) 75%, transparent 100%);
      pointer-events: none;
      z-index: 0;
      opacity: 0.65;
    }

    @keyframes floatGlow {
      0% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(40px, 30px) scale(1.1); }
      100% { transform: translate(-30px, 50px) scale(0.95); }
    }

    /* Header */
    header {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      z-index: 1000;
      padding: 1rem 0;
      background: rgba(7, 6, 11, 0.75);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border-subtle);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.35);
    }

    .nav-container {
      display: flex;
      align-items: center;
      justify-content: space-between;
      max-width: 1280px;
      margin: 0 auto;
      padding: 0 2rem;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 12px;
      background: transparent;
      border: none;
      cursor: pointer;
      font-family: var(--font-heading);
      font-weight: 900;
      font-size: 1.35rem;
      letter-spacing: 0.08em;
      color: #fff;
    }

    .logo-img {
      width: 38px;
      height: 38px;
      border-radius: 12px;
      object-fit: cover;
      border: 1.5px solid var(--border-active);
      box-shadow: 0 0 18px var(--p-glow);
    }

    nav ul {
      display: flex;
      align-items: center;
      gap: 6px;
      list-style: none;
      background: linear-gradient(135deg, var(--bg-surface) 0%, var(--bg-card) 100%);
      padding: 6px 12px;
      border-radius: 999px;
      border: 1px solid var(--border-active);
      backdrop-filter: blur(16px);
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.5), 0 0 25px var(--p-glow);
    }

    .nav-link-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-family: var(--font-heading);
      font-weight: 700;
      font-size: 0.88rem;
      padding: 6px 14px;
      border-radius: 999px;
      cursor: pointer;
      transition: all 0.25s ease;
    }

    .nav-link-btn:hover {
      color: #fff;
      background: rgba(255, 255, 255, 0.06);
    }

    /* Language Switcher */
    .lang-switch-item {
      display: flex;
      align-items: center;
      margin-left: 6px;
      padding-left: 6px;
      border-left: 1px solid var(--border-subtle);
    }
    .lang-switcher {
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .lang-btn {
      background: transparent;
      border: none;
      color: var(--text-dim);
      font-family: var(--font-heading);
      font-size: 0.76rem;
      font-weight: 800;
      cursor: pointer;
      padding: 3px 6px;
      border-radius: 6px;
      transition: all 0.2s ease;
    }
    .lang-btn:hover { color: var(--text-main); }
    .lang-btn.active {
      color: #fff;
      background: var(--p-primary);
      box-shadow: 0 0 10px var(--p-glow);
    }
    .lang-divider {
      color: var(--text-dim);
      font-size: 0.72rem;
      user-select: none;
    }

    /* Main Container */
    .reset-page-wrapper {
      position: relative;
      z-index: 10;
      max-width: 520px;
      width: 100%;
      margin: 8.5rem auto 4rem auto;
      padding: 0 1.5rem;
    }

    .page-back-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: transparent;
      border: none;
      color: var(--p-soft);
      font-family: var(--font-heading);
      font-weight: 700;
      font-size: 0.92rem;
      cursor: pointer;
      margin-bottom: 1.5rem;
      transition: all 0.2s ease;
    }
    .page-back-btn:hover {
      color: #fff;
      transform: translateX(-4px);
    }

    .standalone-card {
      background: var(--bg-surface);
      border: 1.5px solid var(--border-active);
      border-radius: 28px;
      padding: 2.5rem 2.25rem;
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.8), 0 0 50px var(--p-glow);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      position: relative;
      overflow: hidden;
    }

    .reset-header {
      text-align: center;
      margin-bottom: 2rem;
    }

    .reset-icon-wrap {
      width: 68px;
      height: 68px;
      margin: 0 auto 1.25rem;
      border-radius: 20px;
      background: linear-gradient(135deg, var(--border-subtle) 0%, var(--border-active) 100%);
      border: 1.5px solid var(--border-active);
      display: grid;
      place-items: center;
      color: var(--p-light);
      box-shadow: 0 0 25px var(--p-glow);
    }

    .reset-icon-wrap svg {
      width: 32px;
      height: 32px;
    }

    .section-tag {
      display: inline-block;
      font-size: 0.75rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--p-light);
      background: rgba(157, 78, 221, 0.15);
      border: 1px solid var(--border-active);
      padding: 4px 12px;
      border-radius: 999px;
      margin-bottom: 0.8rem;
    }

    .reset-header h1 {
      font-family: var(--font-heading);
      font-size: 1.8rem;
      font-weight: 800;
      color: #fff;
      margin-bottom: 0.5rem;
    }
    .reset-header h1 span {
      background: linear-gradient(135deg, #fff 0%, var(--p-soft) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .reset-header p {
      font-size: 0.95rem;
      color: var(--text-muted);
      line-height: 1.6;
    }

    /* Forms */
    .reset-form {
      display: none;
      flex-direction: column;
      gap: 1.25rem;
    }
    .reset-form.active {
      display: flex;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      text-align: left;
    }

    .form-group label {
      font-size: 0.86rem;
      font-weight: 700;
      color: var(--text-main);
    }

    .input-dark {
      width: 100%;
      background: rgba(10, 6, 18, 0.8);
      border: 1.5px solid var(--border-subtle);
      border-radius: 14px;
      padding: 14px 16px;
      color: #fff;
      font-family: var(--font-sans);
      font-size: 0.95rem;
      transition: all 0.25s ease;
    }

    .input-dark:focus {
      outline: none;
      border-color: var(--p-light);
      box-shadow: 0 0 20px var(--p-glow);
      background: rgba(18, 10, 32, 0.9);
    }

    .input-dark::placeholder {
      color: var(--text-dim);
    }

    .btn-submit {
      width: 100%;
      padding: 14px 0;
      border-radius: 14px;
      background: linear-gradient(135deg, var(--p-primary) 0%, var(--p-electric) 100%);
      border: 1px solid rgba(255, 255, 255, 0.3);
      color: #fff;
      font-family: var(--font-heading);
      font-size: 1rem;
      font-weight: 800;
      cursor: pointer;
      transition: all 0.25s ease;
      box-shadow: 0 6px 25px var(--p-glow);
      margin-top: 0.5rem;
    }

    .btn-submit:hover:not(:disabled) {
      background: linear-gradient(135deg, var(--p-primary-hover) 0%, var(--p-primary) 100%);
      box-shadow: 0 10px 35px var(--p-glow);
      transform: translateY(-2px);
    }

    .btn-submit:disabled {
      opacity: 0.65;
      cursor: not-allowed;
    }

    .auth-switch-link {
      text-align: center;
      margin-top: 1.5rem;
      font-size: 0.9rem;
      color: var(--text-muted);
    }
    .auth-switch-link button {
      background: transparent;
      border: none;
      color: var(--p-light);
      font-family: var(--font-sans);
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
      padding: 0;
      margin-left: 4px;
      transition: color 0.2s;
    }
    .auth-switch-link button:hover {
      color: #fff;
      text-decoration: underline;
    }

    /* Alerts */
    .alert-msg {
      padding: 14px 16px;
      border-radius: 14px;
      font-size: 0.92rem;
      line-height: 1.5;
      margin-bottom: 1.25rem;
      text-align: left;
      animation: fadeInAlert 0.25s ease;
    }
    .alert-msg.error {
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.4);
      color: #fca5a5;
    }
    .alert-msg.success {
      background: rgba(34, 197, 94, 0.15);
      border: 1px solid rgba(34, 197, 94, 0.4);
      color: #86efac;
    }

    @keyframes fadeInAlert {
      from { opacity: 0; transform: translateY(-6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Footer */
    footer {
      padding: 4rem 0 2.5rem 0;
      border-top: 1px solid var(--border-subtle);
      margin-top: auto;
      text-align: center;
      position: relative;
      z-index: 10;
    }

    .footer-links {
      display: flex;
      justify-content: center;
      gap: 1.5rem;
      margin-bottom: 1.25rem;
      flex-wrap: wrap;
    }

    .footer-links button {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      transition: color 0.2s;
    }
    .footer-links button:hover { color: #fff; }

    .footer-links-row {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      gap: 1.25rem;
    }
    .footer-contact-link {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 0.88rem;
      font-weight: 500;
      cursor: pointer;
      text-decoration: none;
      transition: color 0.2s ease, transform 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .footer-contact-link:hover {
      color: #fff;
      text-shadow: 0 0 12px var(--p-glow);
    }
    .footer-contact-link svg {
      color: var(--p-light);
      transition: transform 0.2s ease;
    }
    .footer-contact-link:hover svg {
      transform: scale(1.15);
      color: #fff;
    }
    .footer-divider-dot {
      color: var(--border-active);
      font-size: 0.75rem;
      opacity: 0.5;
    }
    .footer-meta-row {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      gap: 0.85rem;
      font-size: 0.8rem;
      color: var(--text-dim);
      margin-top: 1rem;
    }
    .footer-plat-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 3px 10px;
      border-radius: 6px;
      background: rgba(157, 78, 221, 0.08);
      border: 1px solid var(--border-subtle);
      color: var(--text-muted);
      font-size: 0.76rem;
      font-family: monospace;
    }
    .footer-plat-badge strong {
      color: var(--p-light);
    }
    .copyright { font-size: 0.8rem; color: var(--text-dim); }

    @media (max-width: 640px) {
      .reset-page-wrapper { margin-top: 6.5rem; }
      .standalone-card { padding: 2rem 1.25rem; }
      .reset-header h1 { font-size: 1.55rem; }
    }
  </style>
  <link rel="stylesheet" href="luna-theme.css">
</head>
<body>

  <div class="ambient-glow-1"></div>
  <div class="ambient-glow-2"></div>
  <div class="cyber-grid-bg"></div>

  <!-- Header -->
  <header>
    <div class="nav-container">
      <button type="button" class="logo" onclick="location.href='index.html'" aria-label="LunaVisual">
        <img class="logo-img" src="lunavisual-logo.png" alt="LunaVisual Logo">
        <span>LunaVisual</span>
      </button>
      <nav>
        <ul>
          <li><button type="button" class="nav-link-btn" onclick="location.href='index.html'" data-i18n="nav_home">Главная</button></li>
          <li><button type="button" class="nav-link-btn" onclick="location.href='index.html#features'" data-i18n="nav_features">Особенности</button></li>
          <li><button type="button" class="nav-link-btn" onclick="location.href='index.html#pricing'" data-i18n="nav_pricing">Тарифы</button></li>
          <li><button type="button" class="nav-link-btn" onclick="location.href='profile.html'" data-i18n="nav_profile_long">Личный кабинет</button></li>
          <li class="lang-switch-item">
            <div class="lang-switcher" role="group" aria-label="Language Selector">
              <button type="button" class="lang-btn active" data-lang="ru">RU</button>
              <span class="lang-divider">/</span>
              <button type="button" class="lang-btn" data-lang="en">EN</button>
            </div>
          </li>
        </ul>
      </nav>
    </div>
  </header>

  <!-- Main Container -->
  <div class="reset-page-wrapper">
    <button type="button" class="page-back-btn" onclick="location.href='profile.html'" data-i18n="reset_back_login">
      ← Вернуться ко входу
    </button>

    <div class="standalone-card">
      
      <!-- Top Header -->
      <div class="reset-header">
        <div class="reset-icon-wrap">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
          </svg>
        </div>
        <span class="section-tag" data-i18n="reset_tag">Безопасность</span>
        <h1 id="resetTitle" data-i18n="reset_req_title">Восстановление <span>пароля</span></h1>
        <p id="resetSubtitle" data-i18n="reset_req_subtitle">Введите Email от вашего аккаунта, и мы отправим ссылку для сброса пароля</p>
      </div>

      <!-- Notification / Alert Box -->
      <div id="resetAlert" class="alert-msg" style="display:none;"></div>

      <!-- FORM 1: Request Reset Link (by Email) -->
      <form id="formRequestReset" class="reset-form active" novalidate>
        <div class="form-group">
          <label for="requestEmail" data-i18n="reset_email_label">Ваш Email</label>
          <input type="email" id="requestEmail" class="input-dark" placeholder="name@example.com" required autocomplete="email">
        </div>
        <button type="submit" class="btn-submit" id="btnSubmitRequest" data-i18n="reset_btn_send">
          Отправить ссылку для сброса
        </button>
        <div class="auth-switch-link">
          <span data-i18n="reset_remember_pass">Вспомнили пароль?</span> 
          <button type="button" onclick="location.href='profile.html'" data-i18n="reset_link_login">Войти в аккаунт</button>
        </div>
      </form>

      <!-- FORM 2: Set New Password (Triggered when user opens link with recovery token) -->
      <form id="formUpdatePassword" class="reset-form" novalidate>
        <div class="form-group">
          <label for="newPassword" data-i18n="reset_new_pass_label">Новый пароль</label>
          <input type="password" id="newPassword" class="input-dark" placeholder="Минимум 6 символов" required autocomplete="new-password">
        </div>
        <div class="form-group">
          <label for="confirmNewPassword" data-i18n="reset_confirm_pass_label">Повторите новый пароль</label>
          <input type="password" id="confirmNewPassword" class="input-dark" placeholder="••••••••" required autocomplete="new-password">
        </div>
        <button type="submit" class="btn-submit" id="btnSubmitUpdate" data-i18n="reset_btn_save">
          Сохранить новый пароль
        </button>
      </form>

    </div>
  </div>

  <!-- Footer -->
  <footer>
    <div class="footer-links">
      <button type="button" onclick="location.href='index.html'" data-i18n="footer_home">Главная</button>
      <button type="button" onclick="location.href='index.html#features'" data-i18n="footer_features">Особенности</button>
      <button type="button" onclick="location.href='index.html#pricing'" data-i18n="footer_pricing">Тарифы</button>
      <button type="button" onclick="location.href='profile.html'" data-i18n="footer_profile">Личный кабинет</button>
      <button type="button" onclick="location.href='terms.html'" data-i18n="footer_terms">Пользовательское соглашение</button>
      <button type="button" onclick="location.href='privacy.html'" data-i18n="footer_privacy">Политика конфиденциальности</button>
    </div>

        <!-- Support Channels Row -->

  <script src="app.js?v=20260815_cyber_purple"></script>
  <!-- Script: Supabase & Reset Flow -->
  <script>
    (function() {
      const SUPABASE_URL = "https://pdibtleothnnmihhrbcr.supabase.co";
      const SUPABASE_KEY = "sb_publishable_f74qPRFJj8MQHT1L1Z3GIw_ue3Jx3yK";
      
      let sb = null;
      if (typeof window.supabase !== "undefined") {
        try {
          sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, { auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true, storageKey: 'lunavisual-auth-v2' } });
        } catch (e) {
          console.error("Supabase init error:", e);
        }
      }

      const formRequest = document.getElementById('formRequestReset');
      const formUpdate = document.getElementById('formUpdatePassword');
      const resetTitle = document.getElementById('resetTitle');
      const resetSubtitle = document.getElementById('resetSubtitle');
      const resetAlert = document.getElementById('resetAlert');
      const btnSubmitRequest = document.getElementById('btnSubmitRequest');
      const btnSubmitUpdate = document.getElementById('btnSubmitUpdate');

      function showAlert(msg, type = 'error') {
        if (!resetAlert) return;
        resetAlert.textContent = msg;
        resetAlert.className = 'alert-msg ' + type;
        resetAlert.style.display = 'block';
      }

      function clearAlert() {
        if (!resetAlert) return;
        resetAlert.style.display = 'none';
        resetAlert.textContent = '';
      }

      // Check if we are in recovery mode (user clicked email link)
      function switchToUpdateMode() {
        if (formRequest) formRequest.classList.remove('active');
        if (formUpdate) formUpdate.classList.add('active');
        
        const curLang = localStorage.getItem('lunavisual_lang') || 'ru';
        if (curLang === 'en') {
          if (resetTitle) resetTitle.innerHTML = 'New <span>Password</span>';
          if (resetSubtitle) resetSubtitle.textContent = 'Create a secure new password for your LunaVisual account';
        } else {
          if (resetTitle) resetTitle.innerHTML = 'Новый <span>пароль</span>';
          if (resetSubtitle) resetSubtitle.textContent = 'Придумайте надежный новый пароль для вашего аккаунта LunaVisual';
        }
      }

      // 1. Listen for Supabase Auth state changes
      if (sb) {
        sb.auth.onAuthStateChange((event, session) => {
          if (event === 'PASSWORD_RECOVERY') {
            switchToUpdateMode();
          }
        });
      }

      // 2. Check URL fragments or query parameters for recovery token
      const hash = window.location.hash || '';
      const search = window.location.search || '';
      if (hash.includes('type=recovery') || hash.includes('access_token') || search.includes('code=')) {
        switchToUpdateMode();
      }

      // 3. Handle Form 1: Request Reset Link
      if (formRequest) {
        formRequest.addEventListener('submit', async (e) => {
          e.preventDefault();
          clearAlert();

          const emailInput = document.getElementById('requestEmail');
          const email = emailInput ? emailInput.value.trim() : '';

          if (!email || !email.includes('@') || !email.includes('.')) {
            const isEn = (localStorage.getItem('lunavisual_lang') || 'ru') === 'en';
            showAlert(isEn ? 'Please enter a valid email address.' : 'Введите корректный адрес электронной почты.');
            return;
          }

          if (btnSubmitRequest) {
            btnSubmitRequest.disabled = true;
            btnSubmitRequest.textContent = (localStorage.getItem('lunavisual_lang') || 'ru') === 'en' ? 'Sending...' : 'Отправка...';
          }

          if (sb) {
            try {
              // Current URL without hash or search params
              const redirectUrl = window.location.origin + window.location.pathname;
              const { error } = await sb.auth.resetPasswordForEmail(email, {
                redirectTo: redirectUrl
              });

              if (error) {
                showAlert(error.message || 'Ошибка отправки запроса.', 'error');
              } else {
                const isEn = (localStorage.getItem('lunavisual_lang') || 'ru') === 'en';
                const successMsg = isEn 
                  ? '✓ Password reset link has been sent to your email! Please check your inbox (and spam folder).'
                  : '✓ Ссылка для сброса пароля успешно отправлена на ваш Email! Проверьте входящие сообщения (и папку Спам).';
                showAlert(successMsg, 'success');
                if (emailInput) emailInput.value = '';
              }
            } catch (err) {
              showAlert('Ошибка соединения с сервером.', 'error');
            }
          } else {
            showAlert('✓ Демо-режим: ссылка для сброса отправлена на ' + email, 'success');
          }

          if (btnSubmitRequest) {
            btnSubmitRequest.disabled = false;
            btnSubmitRequest.textContent = (localStorage.getItem('lunavisual_lang') || 'ru') === 'en' ? 'Send Reset Link' : 'Отправить ссылку для сброса';
          }
        });
      }

      // 4. Handle Form 2: Update Password
      if (formUpdate) {
        formUpdate.addEventListener('submit', async (e) => {
          e.preventDefault();
          clearAlert();

          const newPass = document.getElementById('newPassword').value;
          const confirmPass = document.getElementById('confirmNewPassword').value;
          const isEn = (localStorage.getItem('lunavisual_lang') || 'ru') === 'en';

          if (newPass.length < 6) {
            showAlert(isEn ? 'Password must be at least 6 characters.' : 'Пароль должен содержать минимум 6 символов.');
            return;
          }

          if (newPass !== confirmPass) {
            showAlert(isEn ? 'Passwords do not match!' : 'Введенные пароли не совпадают!');
            return;
          }

          if (btnSubmitUpdate) {
            btnSubmitUpdate.disabled = true;
            btnSubmitUpdate.textContent = isEn ? 'Saving...' : 'Сохранение...';
          }

          if (sb) {
            try {
              const { error } = await sb.auth.updateUser({
                password: newPass
              });

              if (error) {
                showAlert(error.message || 'Ошибка обновления пароля.', 'error');
              } else {
                const successMsg = isEn 
                  ? '✓ Password updated successfully! Redirecting to profile in 2 seconds...'
                  : '✓ Пароль успешно изменен! Выполняется перенаправление в личный кабинет...';
                showAlert(successMsg, 'success');
                setTimeout(() => {
                  window.location.href = 'profile.html';
                }, 2000);
                return;
              }
            } catch (err) {
              showAlert('Ошибка соединения с сервером.', 'error');
            }
          } else {
            showAlert('✓ Демо-режим: пароль успешно обновлен!', 'success');
            setTimeout(() => {
              window.location.href = 'profile.html';
            }, 2000);
            return;
          }

          if (btnSubmitUpdate) {
            btnSubmitUpdate.disabled = false;
            btnSubmitUpdate.textContent = isEn ? 'Save New Password' : 'Сохранить новый пароль';
          }
        });
      }

      // 5. Multi-language (i18n) Support
      const I18N = {
        ru: {
          nav_home: "Главная",
          nav_features: "Особенности",
          nav_pricing: "Тарифы",
          nav_profile_long: "Личный кабинет",
          nav_discord: "Discord",
          reset_back_login: "← Вернуться ко входу",
          reset_tag: "Безопасность",
          reset_req_title: "Восстановление <span>пароля</span>",
          reset_req_subtitle: "Введите Email от вашего аккаунта, и мы отправим ссылку для сброса пароля",
          reset_email_label: "Ваш Email",
          reset_btn_send: "Отправить ссылку для сброса",
          reset_remember_pass: "Вспомнили пароль?",
          reset_link_login: "Войти в аккаунт",
          reset_new_pass_label: "Новый пароль",
          reset_confirm_pass_label: "Повторите новый пароль",
          reset_btn_save: "Сохранить новый пароль",
          footer_home: "Главная",
          footer_features: "Особенности",
          footer_pricing: "Тарифы",
          footer_discord: "Discord",
          footer_terms: "Пользовательское соглашение",
          footer_copy: "© 2026 LunaVisual. Все права защищены."
        },
        en: {
          nav_home: "Home",
          nav_features: "Features",
          nav_pricing: "Pricing",
          nav_profile_long: "Dashboard",
          nav_discord: "Discord",
          reset_back_login: "← Back to Login",
          reset_tag: "Security",
          reset_req_title: "Password <span>Recovery</span>",
          reset_req_subtitle: "Enter your registered Email address and we will send a password reset link",
          reset_email_label: "Your Email",
          reset_btn_send: "Send Reset Link",
          reset_remember_pass: "Remembered your password?",
          reset_link_login: "Sign In",
          reset_new_pass_label: "New Password",
          reset_confirm_pass_label: "Confirm New Password",
          reset_btn_save: "Save New Password",
          footer_home: "Home",
          footer_features: "Features",
          footer_pricing: "Pricing",
          footer_discord: "Discord",
          footer_terms: "Terms of Service",
          footer_copy: "© 2026 LunaVisual. All rights reserved."
        }
      };

      function setLanguage(lang) {
        const dict = I18N[lang] || I18N.ru;
        document.querySelectorAll('[data-i18n]').forEach(el => {
          const key = el.getAttribute('data-i18n');
          if (dict[key]) el.innerHTML = dict[key];
        });
        document.querySelectorAll('.lang-btn').forEach(btn => {
          btn.classList.toggle('active', btn.getAttribute('data-lang') === lang);
        });
        localStorage.setItem('lunavisual_lang', lang);
      }

      document.querySelectorAll('.lang-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const lang = btn.getAttribute('data-lang');
          setLanguage(lang);
        });
      });

      const savedLang = localStorage.getItem('lunavisual_lang') || 'ru';
      setLanguage(savedLang);

    })();
  </script>
