<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LunaVisual</title><link rel="icon" href="/lunavisual-logo.png"><style>html,body{margin:0;min-height:100%;background:#020305;color:#f5f8fc;font-family:Inter,Arial,sans-serif}body{min-height:100vh;display:grid;place-items:center;background-image:radial-gradient(circle at 65% 25%,rgba(117,76,255,.16),transparent 32%),linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);background-size:auto,50px 50px,50px 50px}.box{width:min(650px,calc(100% - 40px));padding:38px;border:1px solid rgba(214,226,255,.14);background:#070a0ef2;border-radius:18px;text-align:center;box-shadow:0 0 60px #7c4dff18}.logo{width:64px;height:64px;border-radius:14px}.btn{display:inline-block;margin-top:14px;padding:12px 18px;border-radius:10px;background:#edf5ff;color:#020408;text-decoration:none;font-weight:900}.muted{color:#8c9bab}</style></head><body><main class="box"><img class="logo" src="/lunavisual-logo.png"><h1>Открываем LunaVisual…</h1><p class="muted">Если адрес известен сайту, он будет исправлен автоматически.</p><a class="btn" href="/">На главную</a></main><script>(()=>{const clean=location.pathname.replace(/\/+$/,'');const names=['admin','settings','models','news','creators','profile','privacy','terms','reset-password'];const last=clean.split('/').filter(Boolean).pop()||'';if(names.includes(last))location.replace('/'+last+'.html'+location.search+location.hash);})();</script></body></html>
